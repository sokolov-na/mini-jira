[project]
name = "mini-jira"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sokolov-na", email = "225724418+sokolov-na@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.basedpyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
