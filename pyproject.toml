[project]
name = "mini-jira"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sokolov-na", email = "225724418+sokolov-na@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "colorama>=0.4.6",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "resend[async]>=2.49.1",
    "sqlalchemy>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.basedpyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
allowedUntypedLibraries = ["jwt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: isolated tests without PostgreSQL",
    "integration: repository and service tests with PostgreSQL",
    "e2e: API workflows with PostgreSQL",
    "postgres: requires a dedicated TEST_DATABASE_URL",
]

[tool.coverage.run]
source = ["mini_jira"]
branch = true
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
